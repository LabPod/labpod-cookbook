name: Publish cookbook images

on:
  pull_request:
    paths:
      - "*/template/context/**"
      - "*/template/bundle.json"
      - ".github/cookbook-image-matrix.json"
      - ".github/workflows/publish-images.yml"
      - "scripts/definition-digest.py"
      - "tests/**"
  push:
    branches: [main]
    paths:
      - "*/template/context/**"
      - "*/template/bundle.json"
      - ".github/cookbook-image-matrix.json"
      - ".github/workflows/publish-images.yml"
      - "scripts/definition-digest.py"
  workflow_dispatch: {}

concurrency:
  group: cookbook-images-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  contract:
    name: image contract
    runs-on: ubuntu-22.04
    outputs:
      matrix: ${{ steps.matrix.outputs.matrix }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Test bundle and publishing contracts
        run: python3 -m unittest discover -s tests -v

      - name: Verify every canonical definition digest
        run: |
          set -euo pipefail
          jq -c '.variants[]' .github/cookbook-image-matrix.json | while read -r variant; do
            cookbook=$(jq -r '.cookbook' <<<"$variant")
            expected=$(jq -r '.definition_digest' <<<"$variant")
            build_args=$(jq -r '.build_args' <<<"$variant")
            args=()
            if [[ -n "$build_args" ]]; then
              args+=(--build-arg "$build_args")
            fi
            scripts/definition-digest.py \
              --context "$cookbook/template/context" \
              "${args[@]}" \
              --expect "$expected"
          done

      - name: Set build matrix
        id: matrix
        run: echo "matrix=$(jq -c '{include:.variants}' .github/cookbook-image-matrix.json)" >>"$GITHUB_OUTPUT"

  preflight:
    name: immutable-tag preflight
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: contract
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Refuse to overwrite immutable release tags
        run: |
          set -euo pipefail
          while read -r ref; do
            if docker buildx imagetools inspect "$ref" >/dev/null 2>&1; then
              echo "error: immutable release tag already exists: $ref" >&2
              exit 1
            fi
          done < <(jq -r '.variants[].ref' .github/cookbook-image-matrix.json)

  build-pr:
    name: build PR (${{ matrix.cookbook }}:${{ matrix.cuda }})
    if: github.event_name == 'pull_request'
    needs: contract
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select candidate tag
        id: candidate
        env:
          RELEASE_REF: ${{ matrix.ref }}
        run: echo "ref=${RELEASE_REF}-candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"

      - name: Build candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.cookbook }}/template/context
          file: ${{ matrix.cookbook }}/template/context/Dockerfile
          platforms: linux/amd64
          push: false
          provenance: mode=max
          sbom: true
          tags: ${{ steps.candidate.outputs.ref }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ai.labpod.image.build-input-digest=${{ matrix.definition_digest }}

  build-release:
    name: build release (${{ matrix.cookbook }}:${{ matrix.cuda }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [contract, preflight]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Select candidate tag
        id: candidate
        env:
          RELEASE_REF: ${{ matrix.ref }}
        run: echo "ref=${RELEASE_REF}-candidate-${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" >>"$GITHUB_OUTPUT"

      - name: Build and publish candidate
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: ${{ matrix.cookbook }}/template/context
          file: ${{ matrix.cookbook }}/template/context/Dockerfile
          platforms: linux/amd64
          push: ${{ github.ref == 'refs/heads/main' && github.event_name != 'pull_request' }}
          provenance: mode=max
          sbom: true
          tags: ${{ steps.candidate.outputs.ref }}
          build-args: ${{ matrix.build_args }}
          labels: |
            org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
            ai.labpod.image.build-input-digest=${{ matrix.definition_digest }}

      - name: Verify published candidate label
        env:
          CANDIDATE_REF: ${{ steps.candidate.outputs.ref }}
          EXPECTED: ${{ matrix.definition_digest }}
        run: |
          set -euo pipefail
          labels=$(docker buildx imagetools inspect "$CANDIDATE_REF" --format '{{json .Image.Config.Labels}}')
          [[ "$(jq -r '."ai.labpod.image.build-input-digest"' <<<"$labels")" == "$EXPECTED" ]]

  promote:
    name: publish (${{ matrix.cookbook }}:${{ matrix.cuda }})
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: [contract, build-release]
    runs-on: ubuntu-22.04
    permissions:
      contents: read
      packages: write
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.contract.outputs.matrix) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - name: Set up Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4.2.0

      - name: Promote the validated candidate once
        env:
          CANDIDATE_REF: ${{ matrix.ref }}-candidate-${{ github.sha }}-${{ github.run_id }}-${{ github.run_attempt }}
          RELEASE_REF: ${{ matrix.ref }}
        run: |
          set -euo pipefail
          if docker buildx imagetools inspect "$RELEASE_REF" >/dev/null 2>&1; then
            echo "error: immutable release tag already exists: $RELEASE_REF" >&2
            exit 1
          fi
          docker buildx imagetools create --tag "$RELEASE_REF" "$CANDIDATE_REF"
          candidate=$(docker buildx imagetools inspect --raw "$CANDIDATE_REF" | sha256sum | awk '{print $1}')
          release=$(docker buildx imagetools inspect --raw "$RELEASE_REF" | sha256sum | awk '{print $1}')
          [[ -n "$candidate" && "$release" == "$candidate" ]]
